name: Bartlett primary-document capture
on:
  push:
    branches: [bartlett-record-release-20260928]
    paths: ['.github/workflows/bartlett-source-capture.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Capture public originals and report failures honestly
        shell: bash
        run: |
          mkdir -p captured
          python - <<'PY'
          import concurrent.futures, hashlib, json, pathlib, urllib.request, datetime
          entries = [
            ('June22_2026_City_Packet.pdf','https://www.stjosephmo.gov/AgendaCenter/ViewFile/Minutes/_06222026-3330','pdf'),
            ('City_Bartlett_Statement_2026-09-21.pdf','https://www.stjosephmo.gov/DocumentCenter/View/22248/Statement-on-Bartlett-Center-Changes-September-21-2026-PDF','pdf'),
            ('City_UW_YMCA_Statement_2026-09-28.pdf','https://www.stjosephmo.gov/DocumentCenter/View/22260/Statement-on-Horace-Mann-Future-September-28-2026-PDF','pdf'),
            ('Council_Agenda_2026-09-28.pdf','https://www.stjosephmo.gov/DocumentCenter/View/22252/-September-28-2026-Agenda','pdf'),
            ('City_Procurement_Policy.pdf','https://www.stjosephmo.gov/DocumentCenter/View/8622/Procurement-Policy-PDF','pdf'),
            ('Bartlett_Public_Resolution_2026-09-25.pdf','https://www.kq2.com/wp-content/uploads/2026/09/Signed-formal-resolution-062526.pdf','pdf'),
            ('AG_SJSD_Letter_2024-07-10.pdf','https://ago.mo.gov/wp-content/uploads/2024.07.10-St.-Joseph-School-District-Letter.pdf','pdf'),
            ('Bartlett_FY2025_Form990.xml','https://projects.propublica.org/nonprofits/download-xml?object_id=202610519349300211','xml'),
            ('Bartlett_FY2024_Form990.xml','https://projects.propublica.org/nonprofits/download-xml?object_id=202510529349300816','xml'),
            ('Bartlett_FY2024_Form990.pdf','https://projects.propublica.org/nonprofits/display_990/237116216/IRS%2F237116216_202406_990_2025042323377497','pdf')
          ]
          def capture(e):
            name,url,kind=e
            result={'filename':name,'requested_url':url,'accessed_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
            try:
              request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; public-record preservation)'})
              with urllib.request.urlopen(request,timeout=40) as response:
                data=response.read(40000001)
                result.update(status_code=response.status,final_url=response.url,content_type=response.headers.get('Content-Type'))
              if len(data)>40000000: raise ValueError('40 MB size limit exceeded')
              if kind=='pdf' and not data.startswith(b'%PDF'): raise ValueError('Response is not a PDF')
              if kind=='xml' and (b'<Return' not in data or b'237116216' not in data): raise ValueError('Not a matching IRS return XML')
              pathlib.Path('captured',name).write_bytes(data)
              result.update(status='downloaded_not_yet_content_validated',bytes=len(data),sha256=hashlib.sha256(data).hexdigest())
            except Exception as exc:
              result.update(status='not_obtained',error=str(exc)[:400])
            return result
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
            results=list(pool.map(capture,entries))
          pathlib.Path('captured/ACQUISITION_LOG.json').write_text(json.dumps(results,indent=2))
          print(json.dumps([{'file':r['filename'],'status':r['status']} for r in results],indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bartlett-primary-documents
          path: captured/
          retention-days: 30
          if-no-files-found: error
